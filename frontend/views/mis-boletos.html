<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTicket | Mis Boletos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/mis-boletos.css">
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="/" class="logo">
        <img src="/img/logo.png" alt="MyTicket" class="logo-img">
      </a>
      <input type="checkbox" id="menu-toggle">
      <label for="menu-toggle" class="menu-icon"><i class="fas fa-bars"></i></label>
      <div class="nav-links">
        <a href="/">Inicio</a>
        <a href="/eventos.html">Eventos</a>
        <a href="/mis-boletos.html">Mis Boletos</a>
        <a href="/admin-login.html" style="color:var(--red-main);">Admin</a>
      </div>
      <div class="nav-auth">
        <span id="userName" class="user-name" style="display:none;"></span>
        <a href="/login.html" id="loginBtn" class="btn-auth">Iniciar Sesión</a>
        <button id="logoutBtn" class="btn-logout" style="display:none;">Cerrar Sesión</button>
      </div>
    </div>
  </nav>
  <div class="main-content">
    <div id="boletosContainer" class="loader">
      <div class="spinner"></div>
      <p style="color:var(--text-secondary); font-family:'Poppins',sans-serif;">Cargando tus boletos...</p>
    </div>
  </div>
  <footer class="footer">
    <p>© 2025 MyTicket® – Mis Boletos</p>
  </footer>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/starfield.js"></script>
  <script src="/js/mis-boletos.js"></script>
</body>
</html>
